version: '3.8'

services:
  churn-platform:
    build: .
    image: customer-churn-platform:latest
    container_name: customer_churn_platform_app
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./src/ml/models:/app/src/ml/models
    env_file:
      - .env
    restart: unless-stopped
