name: "\U0001F41B Bug Report"
description: "Report a bug or unexpected behavior in the churn prediction platform."
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: bug-description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When I click 'Train Models', the app crashes with..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to reproduce the behavior."
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or Logs"
      description: "Add screenshots or paste error logs here."

  - type: dropdown
    id: component
    attributes:
      label: "Which component is affected?"
      options:
        - "FastAPI Backend"
        - "Streamlit Frontend"
        - "ML Training Pipeline"
        - "SHAP Explainability"
        - "RAG Agent / ChromaDB"
        - "Database / SQLite"
        - "Docker / Deployment"
        - "Other"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: "Python Version"
      placeholder: "e.g. 3.12.3"

  - type: input
    id: os-version
    attributes:
      label: "Operating System"
      placeholder: "e.g. macOS 14.5 / Ubuntu 22.04"
