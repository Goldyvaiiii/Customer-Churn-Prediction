name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          # Stop build if syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues but don't fail
          flake8 src/ --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Validate ML pipeline imports
        run: |
          python -c "
          from src.ml.pipeline import generate_synthetic_data, build_preprocessor, NUMERIC_FEATURES, CATEGORICAL_FEATURES
          df = generate_synthetic_data(100)
          assert len(df) == 100, 'Synthetic data generation failed'
          assert 'customerID' in df.columns, 'customerID column missing'
          assert 'Churn' in df.columns, 'Churn column missing'
          print('ML pipeline validation PASSED')
          "

      - name: Validate FastAPI app import
        run: |
          python -c "
          import importlib
          app_module = importlib.import_module('src.api.main')
          assert hasattr(app_module, 'app'), 'FastAPI app object missing'
          print('FastAPI import validation PASSED')
          "

      - name: Validate RAG module import
        run: |
          python -c "
          from src.rag.retriever import generate_retrieval_response
          print('RAG retriever import validation PASSED')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: customer-churn-platform:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
